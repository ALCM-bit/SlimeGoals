<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlimeGoals — Hoje (v3, mobile)</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#0F0D15;color:#E8E4F0;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
.sc{flex:1;padding:24px 20px 0;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.ib{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:#1F1B2B;display:grid;place-items:center;color:#E8E4F0}
.ib:focus-visible,.chk:focus-visible,.nv a:focus-visible,.q button:focus-visible{outline:2px solid #B9A3F0;outline-offset:2px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;background:linear-gradient(145deg,#7656D0,#43347F);color:#fff;height:206px;box-sizing:border-box}
.hero i{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.q button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#A39DB8;cursor:pointer}
.q button b{width:56px;height:56px;border-radius:20px;background:#1F1B2B;display:grid;place-items:center;color:#D6C8FA}
.g{display:grid;grid-template-columns:48px 1fr 48px;gap:14px;align-items:center;background:#17141F;border-radius:22px;padding:12px 14px}
.t{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.chk{all:unset;box-sizing:border-box;width:48px;height:48px;border-radius:50%;border:2px solid #9B7BEA;display:grid;place-items:center;color:#B9A3F0}
.m{color:#A39DB8;font-size:13px}
.nv{margin:0 16px 16px;border-radius:28px;background:#1F1B2B;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.nv a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:22px;color:#A39DB8;text-decoration:none;font-size:12px;font-weight:600}
.nv a[aria-current]{background:#3A2F63;color:#fff}
</style>

<style>:root{color-scheme:dark}body{background:#07050b;display:flex;justify-content:center}</style>
</head>
<body>
<div class="ph">
<div class="sc">
<header style="display:flex;align-items:center;gap:12px">
<div style="width:44px;height:44px;border-radius:50%;background:#3A2F63;display:grid;place-items:center;font-weight:800;color:#D6C8FA">F</div>
<div style="flex:1"><div style="font-weight:800;font-size:19px">Oi, Felipe</div><div class="m">Vamos fechar a semana juntos?</div></div>
<button class="ib" type="button" aria-label="Notificações"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/></svg></button>
</header>
<section class="hero" aria-label="Resumo da semana">
<i style="width:180px;height:180px;right:-50px;top:-70px"></i><i style="width:90px;height:90px;left:-30px;bottom:-30px"></i>
<div style="position:relative"><span style="display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:13px;font-weight:600">26 out a 1 nov</span></div>
<div style="position:relative;margin-top:14px;font-size:56px;font-weight:800;line-height:1">76<span style="font-size:28px">%</span></div>
<div style="position:relative;margin-top:6px;font-size:15px;color:#EDE6FD">16 de 21 check-ins feitos</div>
<div style="position:relative;margin-top:14px;width:170px;height:10px;border-radius:5px;background:rgba(255,255,255,.25)"><div style="width:76%;height:100%;border-radius:5px;background:#fff"></div></div>
<div style="position:absolute;right:10px;top:42px;padding:6px 12px;border-radius:14px 14px 4px 14px;background:#fff;color:#2B2150;font-size:13px;font-weight:700">Falta pouco!</div>
<svg style="position:absolute;right:6px;bottom:2px" width="130" height="130" viewBox="0 0 200 200" role="img" aria-label="Slime feliz"><ellipse cx="100" cy="177" rx="66" ry="9" fill="#000" opacity=".25"/><path d="M20 146C20 98 56 66 100 66C144 66 180 98 180 146C180 165 158 174 100 174C42 174 20 165 20 146Z" fill="#C9B6F7"/><ellipse cx="64" cy="94" rx="17" ry="9" transform="rotate(-28 64 94)" fill="#fff" opacity=".6"/><ellipse cx="50" cy="143" rx="9" ry="5" fill="#E58FB5" opacity=".7"/><ellipse cx="150" cy="143" rx="9" ry="5" fill="#E58FB5" opacity=".7"/><ellipse cx="68" cy="128" rx="7.5" ry="9" fill="#1A1226"/><ellipse cx="132" cy="128" rx="7.5" ry="9" fill="#1A1226"/><circle cx="70.5" cy="124.5" r="2.8" fill="#fff"/><circle cx="134.5" cy="124.5" r="2.8" fill="#fff"/><path d="M87 139Q100 162 113 139Z" fill="#1A1226"/></svg>
</section>
<div class="q">
<button type="button"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></b>Nova meta</button>
<button type="button"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></b>Pausar</button>
<button type="button"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></b>Histórico</button>
<button type="button"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></b>Relatório</button>
</div>
<section style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0;font-size:18px;font-weight:800">Para hoje</h2><span class="m">3 metas</span></div>
<div class="g"><div class="t" style="background:#2A2145;color:#B9A3F0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></svg></div><div><div style="font-weight:700;font-size:16px">Estudar inglês</div><div class="m">3 de 5 · próximo às 14:00</div></div><button class="chk" type="button" aria-label="Registrar check-in: Estudar inglês"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></div>
<div class="g"><div class="t" style="background:#3A2133;color:#F0A3C4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M7 6v12M17 6v12M21 9v6M7 12h10"/></svg></div><div><div style="font-weight:700;font-size:16px">Treino</div><div class="m">2 de 4 · próximo às 16:00</div></div><button class="chk" type="button" aria-label="Registrar check-in: Treino"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></div>
<div class="g"><div class="t" style="background:#382E1A;color:#E8B86D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></div><div><div style="font-weight:700;font-size:16px">Leitura (30 min)</div><div class="m">4 de 5 · falta só 1</div></div><button class="chk" type="button" aria-label="Registrar check-in: Leitura de 30 minutos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></div>
</section>
</div>
<nav class="nv" aria-label="Principal">
<a href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Hoje</a>
<a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Metas</a>
<a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Semana</a>
<a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3"/></svg>Ajustes</a>
</nav>
</div>
</body>
</html>
