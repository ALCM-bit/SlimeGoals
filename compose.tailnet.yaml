# Servidor na tailnet, por cima do compose.yaml: o Caddy publica só ${TAILNET_IP}:443, com o certificado lido de arquivos
# (gerado no host por `tailscale cert`). Troca as portas e os volumes do Caddy, não soma. Nada de porta 80, nada de ACME,
# e o socket do tailscaled nunca entra no contêiner.
#   docker compose -f compose.yaml -f compose.tailnet.yaml up -d --build --wait
services:
  caddy:
    ports: !override
      - "${TAILNET_IP:?defina TAILNET_IP no .env}:443:443"
    volumes: !override
      - ./packaging/server/Caddyfile.tailnet:/etc/caddy/Caddyfile:ro
      # tailnet.crt e tailnet.key, somente leitura.
      - ${TAILNET_CERT_DIR:-/etc/slimegoals/tls}:/etc/slimegoals/tls:ro
      - caddy_data:/data
      - caddy_config:/config
