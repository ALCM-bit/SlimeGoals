# Atualizações semanais de pacotes NuGet, ações do GitHub e imagens Docker (as tags com digest também).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Os pacotes do Avalonia saem juntos e precisam da mesma versão: um PR só para todos. A versão é uma propriedade
    # só (AvaloniaVersion, no Directory.Packages.props), que leva junto os pacotes que o Dependabot não enxerga.
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
    # O ASP.NET Core de versão maior só roda nela (o 11 exige net11.0). Os Microsoft.Extensions.* e o
    # Microsoft.Data.Sqlite novos também suportam a versão anterior do .NET e continuam vindo.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # As imagens do Dockerfile do servidor (SDK e runtime do .NET).
  - package-ecosystem: docker
    directory: /src/SlimeGoals.Server
    schedule:
      interval: weekly
    # Só os patches da versão do projeto. Mudar de versão maior (10 para 11) é uma migração:
    # TargetFramework, global.json e as duas imagens juntos, e não um bump isolado.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # As imagens do compose.yaml (PostgreSQL e Caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Versão maior do PostgreSQL (19 para 20) é uma migração, e não um bump: a imagem guarda os dados numa pasta por
    # versão, e a nova subiria com um banco vazio. Pede dump e restauração na VM e a imagem dos testes
    # (PostgresFixture) junto.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
